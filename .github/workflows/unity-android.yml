name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Unity Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # FAST PRE-FLIGHT: verify Unity credentials/license BEFORE cache/build work.
      # If UNITY_EMAIL / UNITY_PASSWORD / UNITY_LICENSE are wrong, the job stops here.
      - name: Check Unity login and license FIRST
        uses: game-ci/unity-activate@2e3cdcc04786759a46afc5a7427f4585a3023131
        timeout-minutes: 3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-Android-
            Unity-Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: RecoilRivals

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Recoil-Rivals-Unity-APK
          path: build/Android
