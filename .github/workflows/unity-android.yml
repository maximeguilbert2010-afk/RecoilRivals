name: Build Unity Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Unity Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Unity-Library-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-Android-
            Unity-Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: RecoilRivals

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Recoil-Rivals-Unity-APK
          path: build/Android
