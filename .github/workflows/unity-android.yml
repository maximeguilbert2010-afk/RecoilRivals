name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: recoil-rivals-unity-android
  cancel-in-progress: false

jobs:
  build:
    name: Unity Android on Recoil PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Import real pistol asset from runner PC
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:USERPROFILE "Downloads\pistol-9mm.zip"),
            (Join-Path $env:USERPROFILE "Desktop\pistol-9mm.zip"),
            (Join-Path $env:USERPROFILE "Documents\pistol-9mm.zip"),
            (Join-Path $env:USERPROFILE "OneDrive\Downloads\pistol-9mm.zip"),
            (Join-Path $env:USERPROFILE "OneDrive\Documents\pistol-9mm.zip"),
            (Join-Path $env:USERPROFILE "OneDrive\Documenten\pistol-9mm.zip")
          )

          $zip = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $zip) {
            $zip = Get-ChildItem -Path $env:USERPROFILE -Filter "pistol-9mm.zip" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $zip) {
            throw "pistol-9mm.zip was not found on this PC. Put it in your Downloads folder and rerun the workflow."
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "Assets\Imported\Pistol9mm"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $destination -Force

          $fbx = Join-Path $destination "source\HIpistol.fbx"
          if (-not (Test-Path $fbx)) {
            throw "The ZIP was found but source\HIpistol.fbx is missing."
          }

          Write-Host "Real pistol asset imported from: $zip"
          Write-Host "FBX: $fbx"

      - name: Find Unity and verify Android support
        shell: powershell
        run: |
          $preferred = "C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Unity.exe"

          if (Test-Path $preferred) {
            $unity = $preferred
          } else {
            $unity = Get-ChildItem "C:\Program Files\Unity\Hub\Editor" -Filter Unity.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\Editor\\Unity\.exe$" } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $unity -or -not (Test-Path $unity)) {
            throw "Unity.exe was not found. Install Unity 6000.6.4f1 in Unity Hub."
          }

          $editorDir = Split-Path $unity
          $androidPlayer = Join-Path $editorDir "Data\PlaybackEngines\AndroidPlayer"
          if (-not (Test-Path $androidPlayer)) {
            throw "Android Build Support is missing. In Unity Hub > Installs > 6000.6.4f1 > Add modules, install Android Build Support + Android SDK & NDK Tools + OpenJDK."
          }

          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Unity: $unity"
          Write-Host "Android support: OK"

      - name: Build Android APK
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP "recoil-rivals-unity-build.log"

          $unityArgs = @(
            "-batchmode",
            "-nographics",
            "-quit",
            "-projectPath", ('"' + $env:GITHUB_WORKSPACE + '"'),
            "-buildTarget", "Android",
            "-executeMethod", "RecoilRivals.Editor.BuildAndroid.PerformBuild",
            "-stackTraceLogType", "Full",
            "-logFile", ('"' + $log + '"')
          )

          Write-Host "Starting Unity and waiting for the build to finish..."
          $process = Start-Process -FilePath $env:UNITY_EXE -ArgumentList $unityArgs -Wait -PassThru
          $exitCode = $process.ExitCode

          if (Test-Path $log) {
            Get-Content $log -Tail 400
          }

          if ($exitCode -ne 0) {
            throw "Unity build failed with exit code $exitCode. See the Unity build log artifact."
          }

          $apk = Join-Path $env:GITHUB_WORKSPACE "build\Android\RecoilRivals.apk"
          if (-not (Test-Path $apk)) {
            throw "Unity finished but the APK was not found at $apk"
          }

          Write-Host "APK ready: $apk"

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Recoil-Rivals-Unity-Build-Log
          path: ${{ runner.temp }}/recoil-rivals-unity-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Recoil-Rivals-Unity-APK
          path: build/Android/RecoilRivals.apk
          if-no-files-found: error
